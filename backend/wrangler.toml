name = "lumio-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# ---------------------------------------------------------------------------
# Development (default — no --env flag)
# `wrangler dev` and `wrangler d1 migrations apply lumio-dev --local` use
# this block directly. database_id is the real UUID assigned by Cloudflare
# when the database was created; it is NOT a secret (D1 ids are not
# sensitive) so it is committed here. Run `wrangler d1 list` to retrieve it.
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "DEBUG"

[[d1_databases]]
binding = "DB"
database_name = "lumio-dev"
database_id = "REPLACE_WITH_LUMIO_DEV_DATABASE_ID"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "lumio-assets-dev"

# ---------------------------------------------------------------------------
# Staging
# ---------------------------------------------------------------------------
[env.staging]
[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "INFO"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lumio-staging"
database_id = "REPLACE_WITH_LUMIO_STAGING_DATABASE_ID"

[[env.staging.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "lumio-assets-staging"

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lumio-production"
database_id = "REPLACE_WITH_LUMIO_PRODUCTION_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "lumio-assets-production"

# ---------------------------------------------------------------------------
# Secrets
# Never declared here — set per-environment via:
#   npx wrangler secret put SESSION_SECRET --env production
# See .dev.vars.example for the local-development equivalent.
# ---------------------------------------------------------------------------
